# =============================================================================
# DESARROLLO LOCAL (Windows + Docker Compose)
# Uso:  docker compose up -d --build
# Requiere: .env en la raíz (copiar desde .env.example)
# =============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: supermarket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: supermarket_system
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - supermarket-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: supermarket-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/auth"
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - supermarket-net

  api:
    build:
      context: ./02-BACKEND/supermarket-system-api
      dockerfile: Dockerfile
    container_name: supermarket-api
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - supermarket-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KEYCLOAK_CLIENT_ID: supermarket-app
      KEYCLOAK_REALM: supermarket
      KEYCLOAK_ADMIN_CLIENT_ID: supermarket-admin-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080/auth
      DB_URL: jdbc:mysql://mysql:3306/supermarket_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Managua
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: validate
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      BILLING_COUNTRY: NI
      PAYMENT_CURRENCY: NIO
      ISSUER_TAX_ID: J0310000000001
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3030,http://localhost:5173,http://127.0.0.1:3030
      SEED_ENABLED: "true"
      ELECTRONIC_INVOICE_ENABLED: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/supermarket/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/auth/realms/supermarket
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      LOKI_URL: http://loki:3100/loki/api/v1/push
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  frontend:
    build:
      context: ./03-FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_KEYCLOAK_URL: /auth
        VITE_KEYCLOAK_REALM: supermarket
        VITE_KEYCLOAK_CLIENT_ID: supermarket-app
    container_name: supermarket-frontend
    depends_on:
      api:
        condition: service_healthy
    networks:
      - supermarket-net
    ports:
      - "80:80"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  balanza:
    build:
      context: ./04-BALANZA
      dockerfile: Dockerfile
    container_name: supermarket-balanza
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3030
      API_URL: http://api:8081/api
    ports:
      - "3030:3030"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3030/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - supermarket-net

  loki:
    image: grafana/loki:latest
    container_name: supermarket-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - supermarket-net

  grafana:
    image: grafana/grafana:latest
    container_name: supermarket-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - loki
    networks:
      - supermarket-net

networks:
  supermarket-net:
    driver: bridge

volumes:
  mysql_data:
  keycloak_data:
